<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="Richard — AI Engineer / Forward Deployed Engineer / Full-Stack AI Developer">
  <title>Richard — AI Engineer</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#0f1923" stop-opacity="0"/><stop offset="1" stop-color="#ff4655" stop-opacity=".10"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4655" stop-opacity="0"/><stop offset="1" stop-color="#ff4655" stop-opacity=".07"/></linearGradient>
    <clipPath id="card"><rect width="860" height="230" rx="10"/></clipPath>
    <clipPath id="role0"><rect x="65.4" y="140" height="32" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.06;0.2062;0.2313;1" values="0;147.2;147.2;0;0"/></rect></clipPath><clipPath id="role1"><rect x="65.4" y="140" height="32" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.25;0.35;0.4562;0.4813;1" values="0;0;332;332;0;0"/></rect></clipPath><clipPath id="role2"><rect x="65.4" y="140" height="32" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.5;0.6;0.7063;0.7312;1" values="0;0;305.6;305.6;0;0"/></rect></clipPath><clipPath id="role3"><rect x="65.4" y="140" height="32" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.75;0.85;0.9563;0.9812;1" values="0;0;490.4;490.4;0;0"/></rect></clipPath>
  </defs>
  <style>
    .name{font:800 44px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#ece8e1}
    .tag{font:600 12px 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px;fill:#ff4655}
    .role{font:500 22px 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ece8e1}
    .pfx{font:700 22px 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff4655}
    .meta{font:500 12px 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px;fill:#8b97a5}
    .ok{font:700 11px 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:2px;fill:#17e8b0}
    
    .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
    @keyframes rise{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
    .glitch{opacity:0;animation:glitch 6s steps(1) 1.2s infinite}
    @keyframes glitch{0%{opacity:.85;transform:translate(3px,-1px)}3%{opacity:.6;transform:translate(-3px,1px)}6%{opacity:0}100%{opacity:0}}
    .spin{transform-origin:770px 112px;animation:spin 14s linear infinite}
    .spin2{transform-origin:770px 112px;animation:spin 9s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(240px)}}
    
  </style>
  <g clip-path="url(#card)">
    <rect width="860" height="230" fill="#0f1923"/>
    <rect width="860" height="230" fill="url(#grid)"/>
    <rect x="430" width="430" height="230" fill="url(#fadeR)"/>
    <rect class="scan" width="860" height="40" fill="url(#scanG)"/>
    <polygon points="0,28 12,16 12,214 0,202" fill="#ff4655"/>
    <rect x="0" y="227" width="860" height="3" fill="#ff4655" opacity=".85"/>

    <text x="40" y="54" class="tag in d1">▸ PROFILE // GAFOUROGLOURICHARD</text>
    <text x="40" y="110" class="name glitch" fill="#ff4655" style="fill:#ff4655">RICHARD GAFOUROGLOU</text>
    <text x="40" y="110" class="name in d2">RICHARD GAFOUROGLOU</text>
    <rect x="40" y="124" width="64" height="3" fill="#ff4655" class="in d3"/>

    <text x="40" y="163" class="pfx">&gt;</text>
    <text clip-path="url(#role0)" x="66.4" y="163" class="role">AI Engineer</text><text clip-path="url(#role1)" x="66.4" y="163" class="role">Forward Deployed Engineer</text><text clip-path="url(#role2)" x="66.4" y="163" class="role">Full-Stack AI Developer</text><text clip-path="url(#role3)" x="66.4" y="163" class="role">building 4MA — a 14-agent business OS</text>
    <rect y="146" width="11" height="22" fill="#ff4655" x="66.4"><animate attributeName="x" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.06;0.2062;0.2313;0.25;0.35;0.4562;0.4813;0.5;0.6;0.7063;0.7312;0.75;0.85;0.9563;0.9812;1" values="66.4;213.6;213.6;66.4;66.4;398.4;398.4;66.4;66.4;372;372;66.4;66.4;556.8;556.8;66.4;66.4"/><animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.55;1"/></rect>

    <g class="in d4">
      <circle cx="46" cy="201" r="4.5" fill="#17e8b0" class="pulse"/>
      <text x="58" y="205" class="ok">OPEN TO WORK · REMOTE / HYBRID</text>
      <text x="820" y="205" text-anchor="end" class="meta">HU · EN · DE · EL</text>
    </g>

    <g opacity=".9">
      <g class="spin"><rect x="725" y="67" width="90" height="90" fill="none" stroke="#ff4655" stroke-width="1.5" stroke-dasharray="6 10" transform="rotate(45 770 112)"/></g>
      <g class="spin2"><rect x="740" y="82" width="60" height="60" fill="none" stroke="#ece8e1" stroke-opacity=".5" stroke-width="1" transform="rotate(45 770 112)"/></g>
      <polygon points="770,94 788,112 770,130 752,112" fill="#ff4655" class="pulse"/>
    </g>
  </g>
</svg>
