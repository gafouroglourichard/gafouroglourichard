name: Update profile art

"on":
  schedule:
    - cron: "17 5 * * *" # every day ~06:17 Budapest (winter time)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -qq fonts-dejavu-core || true
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/make_art.py
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_stats_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/*.svg"
