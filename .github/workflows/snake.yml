name: Contribution snake

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#7ee787&color_dots=#2d333b,#0e4429,#006d32,#26a641,#39d353

      - name: Add dark background
        run: |
          python3 - <<'PY'
          import re
          p = "assets/snake.svg"
          s = open(p, encoding="utf-8").read()
          m = re.search(r'viewBox="([-\d.\s]+)"', s)
          x, y, w, h = (float(v) for v in m.group(1).split())
          rect = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="12" fill="#161b22"/>'
          s = re.sub(r'(<svg[^>]*>)', lambda mo: mo.group(1) + rect, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Commit the snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution snake [skip ci]"
          file_pattern: assets/snake.svg
