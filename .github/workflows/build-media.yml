name: Build README media

# Downloads the real demo videos and iso-flow clips from the portfolio site
# and turns them into looping animated WebPs for the profile README.
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/build_media.py"
      - ".github/workflows/build-media.yml"

permissions:
  contents: write

concurrency:
  group: build-media
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install requests pillow
      - run: python scripts/build_media.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild README media from portfolio [skip ci]"
          file_pattern: "assets/media/*"
